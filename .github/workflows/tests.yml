name: tests

# Exercise observed resource rejection, including a mutation of the evaluation call.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit + non-docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # From the lockfile, not a fresh pip resolution: pyproject turns warnings into
      # errors, so an unpinned dependency upgrade (anyio 4.15's deprecation of an
      # alias starlette still uses) breaks collection while the locked set is green.
      - name: Install
        run: uv sync --frozen

      - name: Run the suite without Docker
        run: uv run pytest -q -m "not docker"

  docker:
    name: docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # From the lockfile, not a fresh pip resolution: pyproject turns warnings into
      # errors, so an unpinned dependency upgrade (anyio 4.15's deprecation of an
      # alias starlette still uses) breaks collection while the locked set is green.
      - name: Install
        run: uv sync --frozen

      # cgroup v2 with the pids and memory controllers delegated is what the
      # resource-outcome tests read. Fail loudly here rather than let those
      # tests skip and report a green run that proved nothing.
      - name: Check cgroup v2 is available
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers \
            || { echo "::error::cgroup v2 not mounted; resource tests cannot run"; exit 1; }
          echo "controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"

      - name: Run the Docker suite
        run: uv run pytest -q -m docker

      # The point of the exercise: if the detection is removed, CI must go red.
      # Without this, the guard can rot back into a docstring.
      - name: Prove the resource guard is load-bearing
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          p = Path("containre/control/orchestrator.py")
          s = p.read_text()
          assert "evaluate_resources(resources) if resources else []" in s
          p.write_text(s.replace("evaluate_resources(resources) if resources else []", "[]"))
          PY
          set +e
          uv run pytest -q tests/test_cgroup_limits.py::test_pids_ceiling_fails_the_run --junitxml=mutation.xml
          result=$?
          set -e
          test "$result" -eq 1
          uv run python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("mutation.xml").iter("testcase"))
          assert len(cases) == 1
          failure = cases[0].find("failure")
          assert failure is not None and "a throttled run was reported as a clean one" in failure.text
          assert cases[0].find("error") is None
          assert cases[0].find("skipped") is None
          PYTEST
          git checkout -- containre/control/orchestrator.py
